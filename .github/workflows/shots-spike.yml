name: Shots spike
on:
  push:
    branches: [shots-spike]
permissions:
  contents: write
jobs:
  shoot:
    if: "!contains(github.event.head_commit.message, 'spike result')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: SHOTS_DEBUG=site/shots-debug node scripts/screenshots/take.mjs $(cat spike-apps.txt 2>/dev/null) > site/shots-log.txt 2>&1 || true
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f site/shots site/shots-log.txt; git add -f site/shots-debug || true
          git commit -m "spike result"
          git push
