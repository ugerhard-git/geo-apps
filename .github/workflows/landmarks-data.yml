# Refreshes the Landmarks app's data (apps/landmarks/data) once a month and
# opens a pull request with the changes, so nothing reaches the site without
# a review. Also runs on demand: Actions → "Landmarks data" → Run workflow.
#
# QLever answers too slowly now for all ~260 countries to fit in one job, so
# the work is split into six parts (landmarks-part.yml), run one after
# another so QLever, a free service, gets one query at a time. Each part
# continues from the previous part's data.
#
# Kept narrow, because the last job can write:
#   - it runs only on a schedule or by hand, never for pull requests, so it
#     only ever runs code from main;
#   - the parts that fetch and run the build script are read-only and install
#     nothing (no npm); their actions are pinned to commits;
#   - the publish job runs no repository code: it takes the finished data,
#     keeps only JSON files, and hands the token to git only to push a new
#     branch and open a pull request.
# The data it fetches from Wikidata (via QLever) is cleaned by
# scripts/landmarks/select.js and written as JSON, never executed.
name: Landmarks data

on:
  schedule:
    - cron: "17 3 1 * *" # 03:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landmarks-data
  cancel-in-progress: false

jobs:
  part1:
    uses: ./.github/workflows/landmarks-part.yml
    with: { part: 1, parts: 6 }
  part2:
    needs: part1
    uses: ./.github/workflows/landmarks-part.yml
    with: { part: 2, parts: 6, previous: landmarks-data-1 }
  part3:
    needs: part2
    uses: ./.github/workflows/landmarks-part.yml
    with: { part: 3, parts: 6, previous: landmarks-data-2 }
  part4:
    needs: part3
    uses: ./.github/workflows/landmarks-part.yml
    with: { part: 4, parts: 6, previous: landmarks-data-3 }
  part5:
    needs: part4
    uses: ./.github/workflows/landmarks-part.yml
    with: { part: 5, parts: 6, previous: landmarks-data-4 }
  part6:
    needs: part5
    uses: ./.github/workflows/landmarks-part.yml
    with: { part: 6, parts: 6, previous: landmarks-data-5 }

  publish:
    needs: part6
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to push the data branch
      pull-requests: write # to open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: landmarks-data-6
          path: apps/landmarks/data
      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only data files may come from the parts.
          find apps/landmarks/data -type f ! -name '*.json' -delete
          # status, not diff: a new file (a country seen for the first time)
          # counts as a change too.
          if [ -z "$(git status --porcelain -- apps/landmarks/data)" ]; then
            echo "No changes."
            exit 0
          fi
          branch="landmarks-data-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add apps/landmarks/data
          git commit -m "Landmarks data: monthly refresh $(date -u +%Y-%m-%d)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          gh pr create --base main --head "$branch" \
            --title "Landmarks data: monthly refresh $(date -u +%Y-%m-%d)" \
            --body "Refreshed by the Landmarks data workflow (run ${GITHUB_RUN_ID}). Check the changed countries, then merge to publish." \
          || echo "::warning::Couldn't open the pull request. Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or open one from the $branch branch."
